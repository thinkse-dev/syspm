name: PR title

# PRs are squash-merged, so the title becomes the commit message on main and
# must be a Conventional Commit. Types must stay in sync with cog.toml.
#
# pull_request_target is used so this also works for PRs from forks. This is
# safe because the workflow never checks out or runs PR code: the action only
# reads the title through the API.

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            style
            revert
          requireScope: false

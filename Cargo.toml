[workspace]
members = ["crates/syspm-cli", "crates/syspm-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# MSRV: equal to the pinned toolchain in rust-toolchain.toml until an older
# toolchain is verified in CI.
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
